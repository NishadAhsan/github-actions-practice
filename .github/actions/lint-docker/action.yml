name: Lint .NET solution (Docker)
description: Verify .NET code formatting inside a .NET SDK container

inputs:
  solution:
    description: Solution file to lint
    required: false
    default: GitHubActionsPractice.sln

outputs:
  result:
    description: Formatting verification result

runs:
  using: docker
  image: Dockerfile
  args:
    - ${{ inputs.solution }}
