name: Lint .NET solution (composite)
description: Verify .NET code formatting through a composite action

inputs:
  solution:
    description: Solution file to lint
    required: false
    default: GitHubActionsPractice.sln

outputs:
  result:
    description: Formatting verification result
    value: ${{ steps.verify-formatting.outputs.result }}

runs:
  using: composite
  steps:
    - name: Verify formatting
      id: verify-formatting
      shell: bash
      run: |
        dotnet format "${{ inputs.solution }}" --verify-no-changes
        echo "result=Formatting verification passed" >> "$GITHUB_OUTPUT"
