name: Application CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore GitHubActionsPractice.sln

      - name: Verify formatting
        run: dotnet format GitHubActionsPractice.sln --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build GitHubActionsPractice.sln --configuration Release --no-restore /warnaserror

      - name: Test solution
        run: >-
          dotnet test GitHubActionsPractice.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test and coverage results
        if: ${{ !cancelled() && (success() || failure()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.sha }}
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Publish API
        run: |
          rm -rf "$RUNNER_TEMP/app-publish"
          dotnet publish src/GitHubActionsPractice.Api/GitHubActionsPractice.Api.csproj \
            --configuration Release \
            --no-build \
            --output "$RUNNER_TEMP/app-publish" \
            /p:UseAppHost=false

      - name: Verify publish output
        run: |
          test -f "$RUNNER_TEMP/app-publish/GitHubActionsPractice.Api.dll"
          if find "$RUNNER_TEMP/app-publish" -type f \( -name '*.db' -o -name '*.db-shm' -o -name '*.db-wal' \) -print -quit | grep -q .; then
            echo "Database files must not be included in the publish artifact."
            exit 1
          fi

      - name: Upload published API
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-publish-${{ github.sha }}
          path: ${{ runner.temp }}/app-publish
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-container:
    needs: build-test-publish
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set image information
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_ref="$image_name:$GITHUB_REF_NAME"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "SMOKE_CONTAINER=ghcr-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "SMOKE_VOLUME=ghcr-smoke-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=ref,event=tag
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=.NET 10 Todo API backed by SQLite
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build tagged image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name "$SMOKE_CONTAINER" --publish 127.0.0.1::8080 \
            --volume "$SMOKE_VOLUME:/app/data" "${{ steps.image.outputs.ref }}"
          port="$(docker port "$SMOKE_CONTAINER" 8080/tcp | sed 's/.*://')"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/health"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$SMOKE_CONTAINER"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image
        id: push
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.image.outputs.ref }}"
          published_reference="$(docker image inspect --format='{{index .RepoDigests 0}}' "${{ steps.image.outputs.ref }}")"
          echo "reference=$published_reference" >> "$GITHUB_OUTPUT"
          echo "digest=${published_reference##*@}" >> "$GITHUB_OUTPUT"

      - name: Write published image summary
        shell: bash
        run: |
          {
            echo '## Published container image'
            echo
            echo "- Image: \`${{ steps.image.outputs.ref }}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Immutable reference: \`${{ steps.push.outputs.reference }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove smoke test resources
        if: ${{ always() }}
        shell: bash
        run: |
          docker rm --force "$SMOKE_CONTAINER" 2>/dev/null || true
          docker volume rm "$SMOKE_VOLUME" 2>/dev/null || true
