name: Manual Demo

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - error
      tags:
        description: 'Test scenario tags'
        required: false
        type: string
      dry_run:
        description: 'Run in dry-run mode'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Environment to run the tests in'
        required: true
        default: 'STAGING'
        type: environment

jobs:
  show-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Print the inputs
        run: |
          echo "Log level chosen: ${{ inputs.logLevel }}"
          echo "Tags entered: ${{ inputs.tags }}"
          echo "Environment chosen: ${{ inputs.environment }}"
          echo "Dry run mode: ${{ inputs.dry_run == true }}"  
          echo "Triggered manually by: ${{ github.actor }}"

      - name: Run automation if DEV environment is selected
        if: ${{ inputs.environment == 'DEV' }}
        run: |
          echo "Running automation for DEV environment..."