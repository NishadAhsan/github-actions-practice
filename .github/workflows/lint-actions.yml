name: Lint actions

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-docker:
    name: Docker action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify formatting
        id: lint
        uses: ./.github/actions/lint-docker

      - name: Show result
        run: echo "${{ steps.lint.outputs.result }}"

  lint-javascript:
    name: JavaScript action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify formatting
        id: lint
        uses: ./.github/actions/lint-javascript

      - name: Show result
        run: echo "${{ steps.lint.outputs.result }}"

  lint-javascript-alt:
    name: JavaScript action alternative
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      
      - name: Verify formatting
        id: lint
        uses: ./.github/actions/lint-javascript-alt

      - name: Show result
        run: echo "${{ steps.lint.outputs.result }}"

  lint-composite:
    name: Composite action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify formatting
        id: lint
        uses: ./.github/actions/lint-composite

      - name: Show result
        run: echo "${{ steps.lint.outputs.result }}"
