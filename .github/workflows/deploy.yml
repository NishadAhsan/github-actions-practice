on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    
    secrets:
      DEPLOYMENT_TOKEN:
        required: true
        description: "Token used for deployment authentication"

    outputs:
      deployment-url: 
        description: "The URL of the deployed environment"
        value: ${{ jobs.deploy.outputs.url }}


jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.return-url.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to environment
        run: |
          if [ "${{ inputs.environment }}" == "PRODUCTION" ]; then
            echo "Deploying to production..."
          elif [ "${{ inputs.environment }}" == "STAGING" ]; then
            echo "Deploying to staging..."
          elif [ "${{ inputs.environment }}" == "DEV" ]; then
            echo "Deploying to development..."
          else
            echo "Unknown environment: ${{ inputs.environment }}"
            exit 1
          fi
        
      - name: Return deployment URL
        id: return-url
        run: |
          if [ "${{ inputs.environment }}" == "PRODUCTION" ]; then
            echo "url=https://production.example.com" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.environment }}" == "STAGING" ]; then
            echo "url=https://staging.example.com" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.environment }}" == "DEV" ]; then
            echo "url=https://dev.example.com" >> $GITHUB_OUTPUT
          fi