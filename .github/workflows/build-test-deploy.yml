name: Build, test and deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Check dotnet version
        run: | 
          dotnet --info
          echo "::warning::We are not building the app actually, just a dry run."
          echo "::add-mask::NazmulAhsan"
          echo "Printing all secrets, super secret value => NazmulAhsan"

  test-unit:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: build
    env:
      TEST_AUTHOR: "Kafia Zaman"
    outputs: 
      status-message: ${{ steps.run-tests.outputs.STATUS_MESSAGE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Mask secret values
        run: echo "::add-mask::$TEST_AUTHOR"

      - name: Run unit tests
        id: run-tests
        run: |
          echo "Running unit tests"
          {
            echo '
            ## Test Results :rocket:

            ```json
            {
              "version": "1.0",
              "tests": [
                {
                  "name": "Test1",
                  "status": "passed"
                },
                {
                  "name": "Test2",
                  "status": "passed"
                }
              ]
            }
            ```
            '
          } >> $GITHUB_STEP_SUMMARY
          echo "::notice file=./README.md,line=10,endline=12,title=Great lines!::WORKFLOW NOTICE"
          echo "STATUS_MESSAGE=All tests passed" >> $GITHUB_OUTPUT
          echo "Test author is $TEST_AUTHOR"

  test-lint:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      status-message: ${{ steps.run-tests.outputs.STATUS_MESSAGE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checking lints
        id: run-tests
        run: |
          echo "Checking lints"
          echo "/home/user/project/src" >> $GITHUB_PATH
          echo "STATUS_MESSAGE=Lints testing passed" >> $GITHUB_OUTPUT

      - name: Test source code again
        run: |
          echo "$PATH"
          echo "::debug::This is my debug message which should not printed normally"

      - name: Test stop-commands
        run: |
          echo "This is a test for stop-commands"
          stop_marker=$(uuidgen)
          echo "::stop-commands::$stop_marker"
          echo "::warning::This message should not be printed"
          echo "::$stop_marker::"
          echo "::notice::This message should be printed"
  
  notify:
    runs-on: ubuntu-latest
    needs: [test-unit, test-lint]
    if: always()
    steps:
      - name: Notify
        run: |
          echo "Notifying about the build and test results, authored by NazmulAhsan"
          echo "Lint ==> ${{ needs.test-lint.result }}: ${{ needs.test-lint.outputs.status-message }}"
          echo "Unit tests ==> ${{ needs.test-unit.result }}: ${{ needs.test-unit.outputs.status-message }}"