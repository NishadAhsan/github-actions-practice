name: Integration tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run integration tests against'
        required: true
        default: 'DEV'
        type: environment

jobs:
  integration-tests:
    name: Run integration tests
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.0.11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgresql:
        image: postgres:17
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.INTEGRATION_DB_NAME }}
        ports:
          - 8911:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install client tools
        run: sudo apt-get update && sudo apt-get install -y redis-tools postgresql-client

      - name: Confirm redis connectivity
        run: |
          if response=$(redis-cli -p 6379 ping); then
            if [[ "$response" == "PONG" ]]; then
              echo "## Redis Health Check :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Redis responded with \`$response\` — service is reachable." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "## Redis Health Check :x:" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Unexpected Redis response: \`$response\`." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            echo "## Redis Health Check :x:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Cannot connect to the Redis service." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      
      - name: Confirm database connectivity
        run: |
          if psql -h localhost -p 8911 -U ${{ vars.POSTGRES_USER }} -d ${{ vars.INTEGRATION_DB_NAME }} -c '\q'; then
            echo "## Database Health Check :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Database is reachable" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Database Health Check :x:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Cannot connect to database" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi